<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: Sėkmės! 1, урок 2</title>
<style>
:root{--bg:#faf9f6;--fg:#1f1e1b;--muted:#6b6a65;--card:#fff;--line:#dcdad3;--accent:#c2410c;--ok:#2f7d4f;--okbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#f1efe9;--muted:#a3a198;--card:#2a2926;--line:#3d3b36;--accent:#fb923c;--ok:#6fcf97;--okbg:#1f3a2b;--bad:#f87171;--badbg:#3f2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qt{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.exp{margin-top:12px;font-size:15px;color:var(--fg);border-left:3px solid var(--accent);padding-left:10px}
.next{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.score{font-size:42px;font-weight:700;margin:6px 0}
.rev{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
.rev b{display:block;margin-bottom:4px}
.good{color:var(--ok)} .wrong{color:var(--bad)}
.back-link{display:inline-block;color:var(--muted);font-size:14px;text-decoration:none;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <a class="back-link" href="../">← К уроку</a>
  <h1>Тест · Урок 2 · Čia mano draugas</h1>
  <div class="sub">Sėkmės! 1 · как дела, откуда вы, языки, обращение, iš + родительный, kalbėti и suprasti</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="num"></span><span id="sc"></span></div>
  <div id="stage"></div>
</div>
<script>
var Q=[
["«Kaip sekasi?» значит…",["Как дела?","Как вас зовут?","Откуда вы?","Вы понимаете?"],0,"Kaip sekasi? — «как дела?». Ответ: Ačiū, gerai! — «Спасибо, хорошо!»"],
["«Šiaip sau» значит…",["так себе","отлично","плохо","очень хорошо"],0,"Šiaip sau — «так себе». Puikiai — «отлично», blogai — «плохо», labai gerai — «очень хорошо»."],
["«Prašom pakartoti!» значит…",["Повторите, пожалуйста!","Говорите медленнее!","Извините!","Пожалуйста, садитесь!"],0,"Pakartoti — «повторить». Prašom kalbėti lėčiau! — «Говорите, пожалуйста, медленнее!»"],
["Как попросить говорить медленнее?",["Prašom kalbėti lėčiau!","Prašom pakartoti!","Ar aišku?","Kaip sekasi?"],0,"Lėčiau — «медленнее», kalbėti — «говорить»."],
["Как ответить на «Ar aišku?» утвердительно?",["Taip, aišku.","Ne, neaišku.","Prašom.","Šiaip sau."],0,"Aišku — «ясно», neaišku — «неясно»."],
["«Čia mano draugė Alicija» значит…",["Это моя подруга Алисия.","Это мой друг Алисий.","Алисия — моя сестра.","Алисия здесь."],0,"Draugas — друг, draugė — подруга. Čia — «здесь, это»."],
["«Truputį» значит…",["немного","очень","сейчас","медленно"],0,"Truputį suprantu — «немного понимаю»."],
["Обращение: Labas, ___! (Tomas)",["Tomai","Tomas","Tomo","Tome"],0,"Мужские имена на -as в звательном падеже получают -ai: Tomas → Tomai."],
["Обращение: Labas, ___! (Paulius)",["Pauliau","Paulius","Paulei","Paulio"],0,"Окончание -us меняется на -au: Paulius → Pauliau."],
["Обращение: Labas, ___! (Eglė)",["Egle","Eglė","Eglai","Eglo"],0,"Окончание -ė меняется на -e: Eglė → Egle."],
["Обращение: Labas, ___! (Balys)",["Baly","Balys","Balai","Balau"],0,"Окончание -ys меняется на -y: Balys → Baly."],
["Обращение: Labas, ___! (Igoris)",["Igori","Igoris","Igorai","Igore"],0,"Окончание -is меняется на -i: Igoris → Igori."],
["Обращение: Laba diena, pone ___! (Jonas)",["Jonai","Jonas","Jone","Jono"],0,"Ponas в звательном падеже — pone, а имя Jonas → Jonai: pone Jonai."],
["Обращение: Labas, ___! (Emilija)",["Emilija","Emilij","Emilije","Emilijai"],0,"Окончание -a не меняется: Emilija → Emilija."],
["Aš esu iš ___. (Lietuva)",["Lietuvos","Lietuva","Lietuvą","Lietuvoje"],0,"После iš нужен родительный падеж. Окончание -a меняется на -os: Lietuva → Lietuvos."],
["Aš esu iš ___. (Vokietija)",["Vokietijos","Vokietijas","Vokietija","Vokietijai"],0,"Vokietija → Vokietijos (-a → -os)."],
["Aš esu iš ___. (Berlynas)",["Berlyno","Berlynos","Berlynas","Berlynio"],0,"Окончание -as меняется на -o: Berlynas → Berlyno."],
["Aš esu iš ___. (Izraelis)",["Izraelio","Izraelo","Izraelės","Izraelis"],0,"Окончание -is меняется на -io: Izraelis → Izraelio."],
["Aš esu iš ___. (Vilnius)",["Vilniaus","Vilnio","Vilnius","Vilniui"],0,"Окончание -us меняется на -aus: Vilnius → Vilniaus."],
["Aš esu iš ___. (Čilė)",["Čilės","Čilos","Čilė","Čilio"],0,"Окончание -ė меняется на -ės: Čilė → Čilės."],
["Aš ___ lietuviškai. (kalbėti)",["kalbu","kalbi","kalba","kalbame"],0,"С aš окончание -u: aš kalbu."],
["Ar tu ___ angliškai? (kalbėti)",["kalbi","kalbu","kalba","kalbate"],0,"С tu окончание -i: tu kalbi."],
["Mes ___ lietuviškai. (kalbėti)",["kalbame","kalbate","kalba","kalbu"],0,"С mes окончание -ame: mes kalbame."],
["Ar jūs ___ prancūziškai? (suprasti)",["suprantate","supranti","supranta","suprantame"],0,"С jūs окончание -ate: jūs suprantate."],
["Atsiprašau, aš ___ vokiškai.",["nesuprantu","nesupranti","nesupranta","nesuprantame"],0,"Отрицание: частица ne- перед глаголом, форма с aš — suprantu → nesuprantu."],
["Jis yra anglas. Jis kalba ___.",["angliškai","anglas","anglų","anglija"],0,"Наречие языка: anglas → angliškai."],
["Jis yra vokietis. Jis kalba ___.",["vokiškai","vokietiškai","vokiečiškai","vokietis"],0,"Исключение: vokietis → vokiškai."],
["Jis yra latvis. Jis kalba ___.",["latviškai","latvijiškai","latvai","latvis"],0,"latvis → latviškai."],
["«Iš kur jūs esate?» значит…",["Откуда вы?","Где вы живёте?","Как вас зовут?","Что вы делаете?"],0,"Iš kur — «откуда». Ответ: Aš esu iš Latvijos."]
];
var order,i,score,wrong,answered;
function shuf(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function start(){order=shuf(Q.map(function(_,k){return k}));i=0;score=0;wrong=[];show()}
function show(){
  var st=document.getElementById("stage");
  document.getElementById("bar").style.width=(i/order.length*100)+"%";
  document.getElementById("sc").textContent="Верно: "+score;
  if(i>=order.length){return finish(st)}
  document.getElementById("num").textContent="Вопрос "+(i+1)+" из "+order.length;
  var q=Q[order[i]];answered=false;
  var opts=shuf(q[1].map(function(t,k){return {t:t,c:k===q[2]}}));
  var h='<div class="q"><p class="qt">'+esc(q[0])+'</p>';
  opts.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>'});
  h+='<div id="fb"></div></div>';
  st.innerHTML=h;
  var btns=st.querySelectorAll(".opt");
  btns.forEach(function(b){b.onclick=function(){
    if(answered)return;answered=true;
    var o=opts[+b.dataset.k];
    btns.forEach(function(x,k){x.disabled=true;if(opts[k].c)x.classList.add("ok")});
    if(o.c){score++}else{b.classList.add("bad");wrong.push({q:q[0],a:q[1][q[2]],e:q[3]})}
    document.getElementById("sc").textContent="Верно: "+score;
    var last=(i+1>=order.length);
    document.getElementById("fb").innerHTML='<div class="exp"><b class="'+(o.c?'good">Верно!':'wrong">Не совсем.')+'</b> '+esc(q[3])+'</div><button class="next" id="nx">'+(last?'Результат':'Дальше')+'</button>';
    document.getElementById("nx").onclick=function(){i++;show()};
  }});
}
function finish(st){
  document.getElementById("bar").style.width="100%";
  document.getElementById("num").textContent="Готово";
  var p=Math.round(score/order.length*100);
  var msg=p>=90?"Отлично! Можно переходить к уроку 3.":p>=70?"Хорошо. Повторите ошибки ниже и переходите дальше.":"Стоит ещё раз пройти конспект урока 2 и повторить тест.";
  var h='<div class="q"><div class="sub">Ваш результат</div><div class="score">'+score+' / '+order.length+'</div><p>'+msg+'</p>';
  if(wrong.length){h+='<p class="qt">Разберите ошибки</p>';wrong.forEach(function(w){h+='<div class="rev"><b>'+esc(w.q)+'</b>Правильно: <span class="good">'+esc(w.a)+'</span><br>'+esc(w.e)+'</div>'})}
  h+='<button class="next" id="again">Пройти ещё раз</button></div>';
  st.innerHTML=h;
  document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>

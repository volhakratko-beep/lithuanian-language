<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тест: Sėkmės! 1, урок 6</title>
<style>
:root{--bg:#faf9f6;--fg:#1f1e1b;--muted:#6b6a65;--card:#fff;--line:#dcdad3;--accent:#c2410c;--ok:#2f7d4f;--okbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b19;--fg:#f1efe9;--muted:#a3a198;--card:#2a2926;--line:#3d3b36;--accent:#fb923c;--ok:#6fcf97;--okbg:#1f3a2b;--bad:#f87171;--badbg:#3f2220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:14px}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.qt{font-size:18px;font-weight:600;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.exp{margin-top:12px;font-size:15px;color:var(--fg);border-left:3px solid var(--accent);padding-left:10px}
.next{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.score{font-size:42px;font-weight:700;margin:6px 0}
.rev{margin:10px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px}
.rev b{display:block;margin-bottom:4px}
.good{color:var(--ok)} .wrong{color:var(--bad)}
.back-link{display:inline-block;color:var(--muted);font-size:14px;text-decoration:none;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
<!--lesson-menu--><style>.lmenu{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:14px}.lmenu span{color:var(--muted);margin-right:2px}.lmenu a{min-width:34px;text-align:center;padding:5px 8px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);background:var(--card)}.lmenu a.cur{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}</style><nav class="lmenu" aria-label="Уроки"><span>Уроки:</span><a href="../../" title="Урок 1">1</a><a href="../../lesson-2/" title="Урок 2">2</a><a href="../../lesson-3/" title="Урок 3">3</a><a href="../../lesson-4/" title="Урок 4">4</a><a href="../../lesson-5/" title="Урок 5">5</a><a href="../../lesson-6/" class="cur" aria-current="page" title="Урок 6">6</a><a href="../../lesson-7/" title="Урок 7">7</a><a href="../../lesson-8/" title="Урок 8">8</a><a href="../../lesson-9/" title="Урок 9">9</a><a href="../../lesson-10/" title="Урок 10">10</a><a href="../../lesson-11/" title="Урок 11">11</a><a href="../../grammar/" title="Грамматика уроков">Грамматика</a></nav><!--/lesson-menu-->
  <a class="back-link" href="../">← К уроку</a>
  <h1>Тест · Урок 6 · Mano sesers vardas yra Lina</h1>
  <div class="sub">Sėkmės! 1 · внешность и характер, чей? (родительный), mano / tavo / jo, прилагательные, старше / младше, tas / ta</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="num"></span><span id="sc"></span></div>
  <div id="stage"></div>
</div>
<script>
var Q=[
["«Kokia yra tavo šeima?» значит…",["Какая у тебя семья?","Где твоя семья?","Сколько у тебя детей?","Кто в твоей семье?"],0,"Koks / kokia — «какой / какая»."],
["«Koks tavo brolio vardas?» значит…",["Как зовут твоего брата?","Где твой брат?","Сколько лет твоему брату?","Кто твой брат?"],0,"Буквально: «Какое имя твоего брата?»"],
["«Kieno vaikas yra tas berniukas?» значит…",["Чей ребёнок этот мальчик?","Где этот мальчик?","Как зовут этого мальчика?","Сколько лет мальчику?"],0,"Kieno — «чей»."],
["Как по-литовски «высокий» (о мужчине)?",["aukštas","žemas","didelis","senas"],0,"Aukštas — высокий, žemas — низкий."],
["Как по-литовски «грустный» (о мужчине)?",["liūdnas","linksmas","mielas","geras"],0,"Liūdnas — грустный, linksmas — весёлый."],
["Как по-литовски «умная» (о женщине)?",["protinga","protingas","protingos","protingi"],0,"Protingas → protinga."],
["Противоположность слова «aukštas»:",["žemas","didelis","senas","tamsus"],0,"Aukštas — žemas."],
["Противоположность слова «linksmas»:",["liūdnas","mažas","jaunas","šviesus"],0,"Linksmas — liūdnas."],
["Противоположность слова «mažas»:",["didelis","senas","žemas","tamsus"],0,"Mažas — didelis."],
["Противоположность слова «šviesus»:",["tamsus","žemas","senas","liūdnas"],0,"Šviesus — tamsus."],
["Противоположность слова «senas»:",["jaunas","žemas","mažas","liūdnas"],0,"Senas — jaunas."],
["Mano ___ vardas yra Rūta. (sesuo)",["sesers","seserį","sesuo","seserys"],0,"Принадлежность: родительный падеж. Sesuo → sesers."],
["Mano ___ vardas yra Antanas. (tėvas)",["tėvo","tėvą","tėvas","tėvai"],0,"-as → -o."],
["Mano ___ vardas yra Regina. (mama)",["mamos","mamą","mama","mamai"],0,"-a → -os."],
["Mano ___ vardas yra Jonas. (brolis)",["brolio","brolį","brolis","broliai"],0,"-is → -io."],
["Mano ___ vardas yra Mantas. (sūnus)",["sūnaus","sūnų","sūnus","sūnūs"],0,"-us → -aus."],
["Mano ___ vardas yra Eglė. (duktė)",["dukters","dukterį","duktė","dukterys"],0,"Duktė → dukters."],
["Mano ___ vardas yra Luna. (šuo)",["šuns","šunį","šuo","šunys"],0,"Šuo → šuns."],
["Mano ___ vardas yra Marija. (senelė)",["senelės","senelę","senelė","senelei"],0,"-ė → -ės."],
["«Mano» — это…",["мой, моя","твой","его","наш"],0,"Aš → mano."],
["Какое слово значит «твой»?",["tavo","mano","jo","jūsų"],0,"Tu → tavo."],
["Какое слово значит «его»?",["jo","jos","jų","mūsų"],0,"Jis → jo, ji → jos."],
["Какое слово значит «её»?",["jos","jo","jų","tavo"],0,"Ji → jos."],
["Какое слово значит «наш»?",["mūsų","jūsų","jų","mano"],0,"Mes → mūsų."],
["Какое слово значит «ваш»?",["jūsų","mūsų","jų","tavo"],0,"Jūs → jūsų."],
["Какое слово значит «их»?",["jų","jo","jos","jūsų"],0,"Jie, jos → jų."],
["Koks tavo brolis? — Jis yra ___ vyras. (aukštas)",["aukštas","aukšta","aukšti","aukštos"],0,"Brolis — мужской род: aukštas."],
["Kokia tavo sesuo? — Ji yra ___. (linksmas)",["linksma","linksmas","linksmi","linksmos"],0,"Sesuo — женский род: linksma."],
["gražus vaikas → ___ sesuo",["graži","gražus","gražios","gražūs"],0,"-us → -i в женском роде."],
["didelis berniukas → ___ mergaitė",["didelė","didelis","dideli","didelės"],0,"-is → -ė."],
["geras brolis → ___ mama",["gera","geras","geros","geri"],0,"-as → -a."],
["įdomus vyras → ___ mergina",["įdomi","įdomus","įdomios","įdomūs"],0,"-us → -i."],
["Мн. ч.: geras brolis →",["geri broliai","geros broliai","geras broliai","gerus broliai"],0,"-as → -i: geri broliai."],
["Мн. ч.: gražus vaikas →",["gražūs vaikai","gražūs vaikas","gražios vaikai","graži vaikai"],0,"-us → -ūs."],
["Мн. ч.: vidurinis vaikas →",["viduriniai vaikai","vidurinis vaikai","viduriniai vaikas","vidurinės vaikai"],0,"-is → -iai (для -inis)."],
["Мн. ч.: didelis berniukas →",["dideli berniukai","didelis berniukai","didelės berniukai","didelius berniukai"],0,"Didelis → dideli."],
["Мн. ч.: gera mama →",["geros mamos","geri mamos","gera mamos","geras mamas"],0,"-a → -os."],
["Мн. ч.: graži sesuo →",["gražios seserys","graži seserys","gražūs seserys","gražios sesuo"],0,"-i → -ios."],
["Мн. ч.: didelė mergaitė →",["didelės mergaitės","dideli mergaitės","didelė mergaitės","didelės mergaitė"],0,"-ė → -ės."],
["Мн. ч.: maža mergaitė →",["mažos mergaitės","maži mergaitės","maža mergaitės","mažas mergaitės"],0,"-a → -os."],
["Kieme žaidžia ___ mergaitės. (maža / mažos)",["mažos","maža","maži","mažas"],0,"Существительное во мн. ч. женского рода → mažos."],
["Kur gyvena tavo ___ seneliai? (mielas / mieli)",["mieli","mielas","miela","mielos"],0,"Seneliai (мужской род, мн. ч.) → mieli."],
["Aš esu ___ vaikas šeimoje. (самый младший)",["jauniausias","jaunesnis","vyriausias","vyresnis"],0,"Jauniausias — самый младший, vyriausias — самый старший."],
["Aš esu ___ vaikas šeimoje. (самый старший)",["vyriausias","jauniausias","jaunesnis","vyresnis"],0,"Vyriausias — самый старший."],
["Mano brolis yra vyresnis ___ mane.",["už","pas","prie","į"],0,"Сравнение: už + винительный падеж."],
["Mano sesuo yra jaunesnė už ___. (я)",["mane","aš","mano","manęs"],0,"Už + винительный: aš → mane."],
["Ar tavo brolis jaunesnis už ___? (ты)",["tave","tu","tavo","tau"],0,"Tu → tave."],
["«Jis yra vyresnis už mane» значит…",["Он старше меня","Он младше меня","Он выше меня","Он старый"],0,"Vyresnis už mane — «старше меня»."],
["Какое слово значит «тот» (м. р.)?",["tas","ta","tie","tos"],0,"Tas — м. р. ед. ч.; ta — ж. р. ед. ч."],
["Какое слово значит «те» (женщины)?",["tos","tie","ta","tas"],0,"Tos — ж. р. мн. ч."]
];
var order,i,score,wrong,answered;
function shuf(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function start(){order=shuf(Q.map(function(_,k){return k}));i=0;score=0;wrong=[];show()}
function show(){
  var st=document.getElementById("stage");
  document.getElementById("bar").style.width=(i/order.length*100)+"%";
  document.getElementById("sc").textContent="Верно: "+score;
  if(i>=order.length){return finish(st)}
  document.getElementById("num").textContent="Вопрос "+(i+1)+" из "+order.length;
  var q=Q[order[i]];answered=false;
  var opts=shuf(q[1].map(function(t,k){return {t:t,c:k===q[2]}}));
  var h='<div class="q"><p class="qt">'+esc(q[0])+'</p>';
  opts.forEach(function(o,k){h+='<button class="opt" data-k="'+k+'">'+esc(o.t)+'</button>'});
  h+='<div id="fb"></div></div>';
  st.innerHTML=h;
  var btns=st.querySelectorAll(".opt");
  btns.forEach(function(b){b.onclick=function(){
    if(answered)return;answered=true;
    var o=opts[+b.dataset.k];
    btns.forEach(function(x,k){x.disabled=true;if(opts[k].c)x.classList.add("ok")});
    if(o.c){score++}else{b.classList.add("bad");wrong.push({q:q[0],a:q[1][q[2]],e:q[3]})}
    document.getElementById("sc").textContent="Верно: "+score;
    var last=(i+1>=order.length);
    document.getElementById("fb").innerHTML='<div class="exp"><b class="'+(o.c?'good">Верно!':'wrong">Не совсем.')+'</b> '+esc(q[3])+'</div><button class="next" id="nx">'+(last?'Результат':'Дальше')+'</button>';
    document.getElementById("nx").onclick=function(){i++;show()};
  }});
}
function finish(st){
  document.getElementById("bar").style.width="100%";
  document.getElementById("num").textContent="Готово";
  var p=Math.round(score/order.length*100);
  var msg=p>=90?"Отлично! Можно переходить к уроку 7.":p>=70?"Хорошо. Повторите ошибки ниже и переходите дальше.":"Стоит ещё раз пройти конспект урока 6 и повторить тест.";
  var h='<div class="q"><div class="sub">Ваш результат</div><div class="score">'+score+' / '+order.length+'</div><p>'+msg+'</p>';
  if(wrong.length){h+='<p class="qt">Разберите ошибки</p>';wrong.forEach(function(w){h+='<div class="rev"><b>'+esc(w.q)+'</b>Правильно: <span class="good">'+esc(w.a)+'</span><br>'+esc(w.e)+'</div>'})}
  h+='<button class="next" id="again">Пройти ещё раз</button></div>';
  st.innerHTML=h;
  document.getElementById("again").onclick=start;
}
start();
</script>
</body>
</html>
